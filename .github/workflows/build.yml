name: TebzaKernel sweet AOSP

on:
  workflow_dispatch:
  push:
    branches:
      - multitask-gaming-battery

permissions:
  contents: read

concurrency:
  group: tebzakernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout source
      uses: actions/checkout@v5

    - name: Set up build environment
      run: |
          set -euo pipefail
          sudo apt-get update --fix-missing
          sudo apt-get install -y git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python-is-python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
          libghc-libyaml-dev libyaml-dev glibc-source

    - name: Verify multitasking tuning
      run: |
          set -euo pipefail
          python3 scripts/apply_multitask_tuning.py
          git diff --exit-code -- \
            arch/arm64/configs/vendor/sweet_user_defconfig \
            mm/vmscan.c kernel/sysctl.c
          grep -q '^CONFIG_SWAP=y$' arch/arm64/configs/sweet_defconfig
          grep -q '^CONFIG_ZRAM_SIZE_OVERRIDE=6$' arch/arm64/configs/sweet_defconfig
          grep -q '^int vm_swappiness = 200;$' mm/vmscan.c
          grep -A8 'procname.*swappiness' kernel/sysctl.c | grep -q 'extra2.*two_hundred'
          grep -q '^CONFIG_DEFAULT_KP_MODE=2$' arch/arm64/configs/sweet_defconfig
          grep -q '^CONFIG_AUTO_KPROFILES_MSM_DRM=y$' arch/arm64/configs/sweet_defconfig
          grep -q '^static bool auto_kprofiles __read_mostly = true;$' \
            drivers/misc/kprofiles/main.c

    - name: Build signed AOSP kernel ZIP
      run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/RooGhz720/RooGhz720/25ee8bf4e7daf6a041f1dab4fffd27d60a93d5e7/rx/miui-r20.sh \
            --output upstream-r20-build.sh
          python3 scripts/patch_android16_packaging.py upstream-r20-build.sh
          grep -q '^TYPE="AOSP"$' upstream-r20-build.sh
          grep -q '^KERNEL_NAME="TebzaKernel"$' upstream-r20-build.sh
          grep -q '^AnyKernelbranch="sweetAOSP"$' upstream-r20-build.sh
          chmod +x upstream-r20-build.sh
          bash upstream-r20-build.sh

    - name: Verify flashable package
      run: python3 scripts/verify_flashable_zip.py artifacts

    - name: Upload flashable package
      uses: actions/upload-artifact@v4
      with:
        name: TebzaKernel-sweet-AOSP-${{ github.run_number }}
        path: |
          artifacts/*-signed.zip
          artifacts/SHA256SUMS
        if-no-files-found: error
        retention-days: 30
