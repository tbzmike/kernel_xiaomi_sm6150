name: TebzaKernel sweet AOSP

on:
  workflow_dispatch:
  push:
    branches:
      - multitask-gaming-battery

permissions:
  contents: read

concurrency:
  group: tebzakernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout source
      uses: actions/checkout@v5

    - name: Set up build environment
      run: |
          set -euo pipefail
          sudo apt-get update --fix-missing
          sudo apt-get install -y git make bc bison \
          openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler \
          ca-certificates python-is-python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi \
          libghc-libyaml-dev libyaml-dev glibc-source \
          default-jdk-headless

    - name: Verify requested source contract
      run: |
          set -euo pipefail
          python3 scripts/apply_multitask_tuning.py
          git diff --exit-code
          python3 scripts/verify_source_contract.py
          python3 scripts/verify_lmkd_config.py \
            arch/arm64/configs/sweet_defconfig

    - name: Build signed AOSP kernel ZIP
      run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/RooGhz720/RooGhz720/25ee8bf4e7daf6a041f1dab4fffd27d60a93d5e7/rx/miui-r20.sh \
            --output upstream-r20-build.sh
          python3 scripts/patch_android16_packaging.py upstream-r20-build.sh
          grep -q '^TYPE="AOSP"$' upstream-r20-build.sh
          grep -q '^KERNEL_NAME="TebzaKernel"$' upstream-r20-build.sh
          grep -q '^AnyKernel="https://github.com/basamaryan/AnyKernel3"$' upstream-r20-build.sh
          grep -q '^AnyKernelbranch="master"$' upstream-r20-build.sh
          grep -q '^AnyKernelcommit="4875a3c81fef3ee363f79c4f682defa58c031631"$' upstream-r20-build.sh
          grep -q '^export IMG="$MY_DIR"/out/arch/arm64/boot/Image.gz$' upstream-r20-build.sh
          chmod +x upstream-r20-build.sh
          bash upstream-r20-build.sh

    - name: Verify flashable package
      run: |
          set -euo pipefail
          python3 scripts/verify_flashable_zip.py artifacts
          python3 scripts/verify_built_kernel.py artifacts
          signed_zips=(artifacts/*-signed.zip)
          jarsigner -verify "${signed_zips[0]}"

    - name: Upload flashable package
      uses: actions/upload-artifact@v4
      with:
        name: TebzaKernel-sweet-AOSP-${{ github.run_number }}
        path: |
          artifacts/*-signed.zip
          artifacts/SHA256SUMS
          artifacts/kernel.config
          artifacts/kernel.embedded.config
        if-no-files-found: error
        retention-days: 30
